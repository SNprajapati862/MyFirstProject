<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page 1</title>
  <style>
    body {
      opacity: 1;
      transition: opacity 0.5s;
    }
    body.fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>
  <h1>Page 1</h1>
  <button id="next">Go to Page 2</button>

  <script>
    document.getElementById("next").addEventListener("click", () => {
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "hi2.html";
      }, 500); // matches CSS duration
    });
  </script>
</body>
</html>
