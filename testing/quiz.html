<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Quiz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.quiz-box{
    background:white;
    width:450px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
    margin-bottom:20px;
}

#score{
    color:#555;
    margin-bottom:15px;
}

.option{
    background:#f4f4f4;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    background:#ddd;
}

.correct{
    background:#4CAF50 !important;
    color:white;
}

.wrong{
    background:#f44336 !important;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2196F3;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
    display:none;
}

button:hover{
    background:#1976D2;
}
</style>
</head>
<body>

<div class="quiz-box">

<h2 id="question"></h2>

<div id="answers"></div>

<p id="score"></p>

<button id="nextBtn">Next Question</button>

</div>

<script>

const quiz = [

{
question:"What does HTML stand for?",
answers:[
"Hyper Text Markup Language",
"Home Tool Markup Language",
"Hyperlinks and Text Markup Language",
"Hyper Transfer Machine Language"
],
correct:0
},

{
question:"Which tag creates a paragraph?",
answers:[
"<div>",
"<h1>",
"<p>",
"<span>"
],
correct:2
},

{
question:"Which language makes a webpage interactive?",
answers:[
"CSS",
"HTML",
"JavaScript",
"Python"
],
correct:2
},

{
question:"Which CSS property changes text color?",
answers:[
"font-size",
"background",
"color",
"text-align"
],
correct:2
}

];

let currentQuestion=0;
let score=0;

const question=document.getElementById("question");
const answers=document.getElementById("answers");
const scoreText=document.getElementById("score");
const nextBtn=document.getElementById("nextBtn");

function loadQuestion(){

nextBtn.style.display="none";

question.innerHTML=quiz[currentQuestion].question;

answers.innerHTML="";

quiz[currentQuestion].answers.forEach((answer,index)=>{

const div=document.createElement("div");

div.className="option";

div.innerHTML=answer;

div.onclick=()=>checkAnswer(div,index);

answers.appendChild(div);

});

scoreText.innerHTML="Score: "+score;
}

function checkAnswer(selected,index){

const options=document.querySelectorAll(".option");

options.forEach(option=>option.style.pointerEvents="none");

if(index===quiz[currentQuestion].correct){

selected.classList.add("correct");

score++;

scoreText.innerHTML="✅ Correct! Score: "+score;

}else{

selected.classList.add("wrong");

options[quiz[currentQuestion].correct].classList.add("correct");

scoreText.innerHTML="❌ Wrong! Score: "+score;

}

nextBtn.style.display="block";

}

nextBtn.onclick=function(){

currentQuestion++;

if(currentQuestion<quiz.length){

loadQuestion();

}else{

document.querySelector(".quiz-box").innerHTML=`
<h1>🎉 Quiz Finished!</h1>
<h2>Your Score: ${score} / ${quiz.length}</h2>

<button style="display:block;margin-top:20px;" onclick="location.reload()">
Play Again
</button>
`;

}

}

loadQuestion();

</script>

</body>
</html>
