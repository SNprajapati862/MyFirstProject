<!DOCTYPE html>
<html>
<head>
<title>Simple Quiz</title>

<style>
body{
    font-family:Arial;
    background:#f0f8ff;
    text-align:center;
}

.quiz{
    width:400px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

button{
    display:block;
    width:100%;
    margin:10px 0;
    padding:10px;
    cursor:pointer;
}

#next{
    display:none;
}
</style>
</head>

<body>

<div class="quiz">

<h2 id="question"></h2>

<div id="answers"></div>

<h3 id="result"></h3>

<button id="next" onclick="nextQuestion()">Next</button>

</div>

<script>

let questions = [
{
    question: "What does HTML stand for?",
    options: [
        "Hyper Text Markup Language",
        "Home Tool Markup Language",
        "Hyper Transfer Machine Language"
    ],
    answer: 0
},
{
    question: "Which tag makes a paragraph?",
    options: [
        "<div>",
        "<p>",
        "<h1>"
    ],
    answer: 1
},
{
    question: "Which language makes webpages interactive?",
    options: [
        "CSS",
        "JavaScript",
        "HTML"
    ],
    answer: 0
}
];

let current = 0;
let score = 0;

showQuestion();

function showQuestion(){

document.getElementById("question").innerHTML =
questions[current].question;

document.getElementById("result").innerHTML = "";

document.getElementById("next").style.display = "none";

let text = "";

for(let i=0;i<questions[current].options.length;i++){

text +=
`<button onclick="check(${i})">
${questions[current].options[i]}
</button>`;

}

document.getElementById("answers").innerHTML = text;

}

function check(choice){

if(choice == questions[current].answer){

document.getElementById("result").innerHTML = "✅ Correct!";
score++;

}else{

document.getElementById("result").innerHTML =
"❌ Wrong! Correct answer is: " +
questions[current].options[questions[current].answer];

}

document.getElementById("next").style.display = "block";

}

function nextQuestion(){

current++;

if(current < questions.length){

showQuestion();

}else{

document.querySelector(".quiz").innerHTML =
"<h2>Quiz Finished!</h2>" +
"<h3>Your Score: " + score + " / " + questions.length + "</h3>" +
"<button onclick='location.reload()'>Play Again</button>";

}

}

</script>

</body>
</html>
